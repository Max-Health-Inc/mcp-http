# Dependabot configuration — GitHub Actions ONLY.
#
# Matches armband and sleeptracker, which were always actions-only. The npm ecosystem is
# deliberately absent: DRY.codes already reports dependency drift across every indexed repo at
# once (`list_dependency_drift`), which is the more useful view — a library pinned at N
# different versions org-wide, rather than one repo nudged at a time with no sight of its
# siblings.
#
# Actions are kept because nothing else watches them: pinned per workflow file, invisible to a
# package index, and a stale action is a supply-chain question rather than a drift one.
#
# NOTE: Dependabot reads this file from the DEFAULT branch, so a change here takes effect once
# `develop` is promoted to main, not on the push to develop.
#
# IMPORTANT — target-branch: "develop"
# Merging to `main` publishes to npm (see .github/workflows/release.yml). Dependabot
# PRs must therefore land on `develop` and ship through the normal promotion PR, or a
# routine dependency bump would cut a release on merge.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR per week for all action bumps rather than one per action.
      actions:
        patterns:
          - "*"
