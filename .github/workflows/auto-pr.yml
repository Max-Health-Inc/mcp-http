name: Auto PR (develop → main)

# Merging the standing PR publishes to npm through release.yml.
on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    uses: max-network/.github/.github/workflows/auto-pr.yml@main
    with:
      head-branch: develop
      title: "🚀 Promote develop → main (@maxhealth.tech/mcp-http)"
      body: |
        **Automated PR** — merging `develop` into `main`.

        Merging **publishes to npm**: release.yml stamps the changelog, tags, and publishes.
    secrets: inherit
