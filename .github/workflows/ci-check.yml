name: CI

on:
  push:
    branches: [main, develop, "develop/**"]
  pull_request:
    branches: [main, develop]

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  test:
    uses: max-network/.github/.github/workflows/check.yml@main
    with:
      runtime: bun
      steps: "typecheck lint format:check test build verify:dist"

  changelog:
    uses: max-network/.github/.github/workflows/changelog-guard.yml@main
