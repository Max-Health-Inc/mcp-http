name: Publish

# Dispatched by release.yml at the tag it pushed. A version below npm's `latest` (a backport
# from a release/* line) is published under the `legacy` dist-tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      runtime: bun
      node-version: "24"
      scope: "@maxhealth.tech"
      registry: https://registry.npmjs.org
      check-steps: "check"
