name: Release & Publish

# Merging to `main` publishes to npm. A merge with nothing under `## [Unreleased]` skips;
# a manual dispatch with an empty changelog fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  release:
    uses: max-network/.github/.github/workflows/changelog-release.yml@main
    with:
      staging-branch: develop
      checks: |
        bun run typecheck
        bun run lint
        bun run format:check
        bun test
    secrets: inherit
