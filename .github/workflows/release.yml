name: Release & Publish

# Merging to `main` publishes to npm.
#
# The release commit this workflow pushes back to `main` does NOT re-trigger it:
# pushes made with GITHUB_TOKEN never start another workflow run. That is the same
# property the "Trigger publish workflow" step at the bottom works around, and it is
# what keeps this from looping.
#
# A merge that documents nothing under `## [Unreleased]` skips the release instead of
# failing, so a README or CI-only merge does not redden `main`. A manual
# workflow_dispatch with an empty changelog still fails loudly, because asking for a
# release explicitly and having nothing to ship is an error.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.version.outputs.next }}
      should_release: ${{ steps.changelog.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # -- Version bump
      - name: Determine next version
        id: version
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          PKG_VERSION=$(jq -r .version package.json)

          NPM_LATEST=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          echo "npm-latest=$NPM_LATEST" >> "$GITHUB_OUTPUT"

          # Honour an intentional bump: if package.json is strictly ahead of the
          # npm latest (a manual minor/major bump, e.g. a breaking change), ship
          # that version. Otherwise patch-bump npm latest (the default cadence).
          HIGHEST=$(printf '%s\n%s\n' "$NPM_LATEST" "$PKG_VERSION" | sort -V | tail -1)
          if [ "$PKG_VERSION" != "$NPM_LATEST" ] && [ "$HIGHEST" = "$PKG_VERSION" ]; then
            NEXT="$PKG_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$NPM_LATEST"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "### Version: $NPM_LATEST -> $NEXT" >> "$GITHUB_STEP_SUMMARY"

      # -- Changelog gate
      # `--check` writes nothing and always exits 0; we branch on the reported status.
      - name: Check changelog
        id: changelog
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          STATUS=$(bun scripts/changelog-release.ts --check "$NEXT")
          echo "Changelog status for $NEXT: $STATUS"

          if [ "$STATUS" = "missing" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::CHANGELOG.md documents nothing for $NEXT. Add entries under '## [Unreleased]' before releasing."
              exit 1
            fi
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped: nothing documented under [Unreleased]" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Test, Build, Release, Publish
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Promotes [Unreleased] to the version being shipped. The gate job already
      # confirmed there is something to promote.
      - name: Stamp changelog entry
        run: bun scripts/changelog-release.ts "${{ needs.gate.outputs.next }}"

      - name: Update package.json version
        run: |
          NEXT="${{ needs.gate.outputs.next }}"
          jq --arg v "$NEXT" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Updated package.json to $NEXT"

      # -- Quality gates
      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      # -- Build
      - name: Build
        run: bun run build

      # -- Commit version bump
      - name: Commit & tag
        run: |
          NEXT="${{ needs.gate.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${NEXT}" || echo "No changes to commit"
          git tag "v${NEXT}"
          git push origin main --tags

      # -- Keep develop in step with the promoted changelog
      #
      # The release commit promotes [Unreleased] to a version heading on main.
      # If develop is left behind, its still-open [Unreleased] and main's new
      # version heading differ only in where that heading sits, and git's
      # line-based merge will happily file develop's newer entries under the
      # older release heading — silently attributing unshipped work to a
      # published version, and emptying [Unreleased] so the next merge skips its
      # release. That happened between v0.2.1 and v0.3.0.
      #
      # Best effort by design: never fail a completed release over a sync. If the
      # merge conflicts, the summary says so and it is resolved by hand.
      - name: Sync release commit back into develop
        run: |
          NEXT="${{ needs.gate.outputs.next }}"
          git fetch origin develop || exit 0
          if git checkout -B develop origin/develop && git merge main --no-edit; then
            git push origin develop
            echo "- Synced \`v${NEXT}\` release commit back into \`develop\`" >> "$GITHUB_STEP_SUMMARY"
          else
            git merge --abort || true
            echo "- :warning: Could not auto-sync \`v${NEXT}\` into \`develop\` (conflict). Merge \`main\` into \`develop\` by hand before the next release, or unreleased entries will be mis-filed under \`## [${NEXT}]\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          git checkout main

      # -- GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.gate.outputs.next }}
          name: v${{ needs.gate.outputs.next }}
          generate_release_notes: true

      # Trigger publish.yml explicitly (GITHUB_TOKEN tag pushes don't trigger other workflows)
      - name: Trigger publish workflow
        run: gh workflow run publish.yml --ref "v${{ needs.gate.outputs.next }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          NEXT="${{ needs.gate.outputs.next }}"
          PACKAGE_NAME=$(jq -r .name package.json)
          echo "### Released ${PACKAGE_NAME}@${NEXT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${NEXT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm publish will be triggered by publish.yml via the v${NEXT} tag" >> "$GITHUB_STEP_SUMMARY"
